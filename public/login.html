<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Gobfish — Login</title>


<script type="module">
window.addEventListener('error', e => console.error(e.error || e.message));
window.addEventListener('unhandledrejection', e => console.error('Promise rejection:', e.reason));

const CLIENT_ID   = '6isq54n8of787rxzpoiuwlqq9jaq3k';
const REDIRECT_URI= location.origin + location.pathname; // this page
const AUTH_BASE   = 'https://id.twitch.tv/oauth2/authorize';
const SCOPES      = ['user:read:subscriptions'];
const NEXT_URL    = new URLSearchParams(location.search).get('next') || 'app.html';

// CSRF state
function rand(n=32){return [...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('')}
const state = sessionStorage.state || (sessionStorage.state = rand());

if (location.hash.includes('access_token=')) {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get('state') !== sessionStorage.state) { alert('State mismatch'); throw new Error('state mismatch'); }
  const accessToken = params.get('access_token');
  sessionStorage.twitch_token = accessToken;

  // 1) Helix whoami
  const r = await fetch('https://api.twitch.tv/helix/users', {
    headers: { 'Authorization':'Bearer '+accessToken, 'Client-Id': CLIENT_ID }
  });
  if (!r.ok) { alert('Failed to fetch Twitch profile'); throw new Error(await r.text()); }
  const u = (await r.json()).data?.[0];
  if (!u) { alert('No Twitch user in response'); throw new Error('no user'); }

  // 2) Upsert to DB (creates server session)
  const r2 = await fetch('api/users_upsert.php', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ access_token: accessToken })
  });
  if (!r2.ok) { alert('Upsert failed'); throw new Error(await r2.text()); }
  const saved = await r2.json();
  console.log('Upserted user:', saved);

  // 3) Verify server session cookie is set
  const me = await fetch('api/whoami.php');
  if (!me.ok) {
    const t = await me.text();
    document.body.innerHTML = `<h1>Login error</h1><pre>${me.status} ${t}</pre><p><button onclick="location.reload()">Try again</button></p>`;
    throw new Error('whoami failed: '+me.status+' '+t);
  }
  console.log('whoami:', await me.json());

  // 4) Check + persist sub status for ellipsis_goblins (non-blocking if it fails)
  try {
    const sub = await fetch('api/sub_status.php', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ access_token: accessToken, channel_login: 'ellipsis_goblins' })
    });
    console.log('sub status:', await sub.json());
  } catch (e) {
    console.warn('sub check failed', e);
  }

  // 5) Clean the URL (remove #access_token) and redirect once
  history.replaceState({}, '', location.pathname + location.search);
  window.location.replace(NEXT_URL);

} else {
  // Show connect button
  const url = new URL(AUTH_BASE);
  url.searchParams.set('client_id',    CLIENT_ID);
  url.searchParams.set('redirect_uri', REDIRECT_URI);
  url.searchParams.set('response_type','token');
  url.searchParams.set('scope',        SCOPES.join(' '));
  url.searchParams.set('state',        state);

  document.body.innerHTML = `
    <h1>Gobfish</h1>
    <a href="${url}">Connect with Twitch</a>
  `;
}
</script>
